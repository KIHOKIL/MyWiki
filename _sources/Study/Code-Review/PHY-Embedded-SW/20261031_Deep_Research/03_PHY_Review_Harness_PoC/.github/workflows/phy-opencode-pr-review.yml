name: PHY SW Hybrid AI Code Review (ARM Clang + AST-Grep + OpenCode)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

jobs:
  phy-hybrid-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR Branch with Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate CMake compile_commands.json (ARM Clang)
        run: |
          cmake -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_C_COMPILER=armclang || true

      - name: Run Deterministic AST-Grep 5-Layer Scan
        run: |
          if command -v ast-grep >/dev/null 2>&1; then
            ast-grep scan --rule .ast-grep/rules/phy-hal-isr-rules.yml --json > ast_findings.json || true
          else
            echo "[]" > ast_findings.json
          fi

      - name: Extract Call-Graph Blast Radius (code-review-graph)
        run: |
          pip install --quiet code-review-graph || true
          if command -v code-review-graph >/dev/null 2>&1; then
            code-review-graph build || true
            code-review-graph detect-changes --base "origin/${{ github.base_ref }}" > blast_radius.txt || true
          else
            git diff --stat "origin/${{ github.base_ref }}...HEAD" > blast_radius.txt
          fi

      - name: Run OpenCode Cross-Model Review & PHY 5-Axis Risk Scoring
        env:
          INTERNAL_LLM_BASE_URL: ${{ secrets.INTERNAL_LLM_BASE_URL }}
          INTERNAL_LLM_API_KEY: ${{ secrets.INTERNAL_LLM_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git diff -U5 "origin/${{ github.base_ref }}...HEAD" -- '*.c' '*.h' '*.cpp' '*.hpp' | head -c 90000 > pr_diff.patch

          opencode run \
            --model litellm/deepseek-r1 \
            --agent phy-chief-verifier \
            "Analyze the attached PHY Embedded SW PR diff, AST-Grep findings, and Call-Graph Blast Radius. Perform the Disproving Pass to eliminate false positives, compute the PHY 5-Axis Risk Score (0-100), and output the review report ending with VERDICT: PASS or VERDICT: FAIL.

          [AST-Grep Findings]
          $(cat ast_findings.json)

          [Blast Radius Summary]
          $(cat blast_radius.txt)

          [PR Diff]
          $(cat pr_diff.patch)" > review_report.md

      - name: Upsert Sticky PR Comment & Apply Risk Tier Label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          MARKER="<!-- phy-ai-review -->"
          BODY="${MARKER}
          ## 🛡️ PHY Embedded SW — OpenCode Hybrid AI Review
          $(cat review_report.md)"

          EXISTING_ID=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.body | startswith(\"${MARKER}\")) | .id" | head -n 1)

          if [ -n "$EXISTING_ID" ]; then
            gh api --method PATCH "repos/${REPO}/issues/comments/${EXISTING_ID}" -f body="$BODY"
          else
            gh pr comment "$PR_NUMBER" --body "$BODY"
          fi

          # Extract Risk Tier label (risk:low | risk:medium | risk:high | risk:critical)
          RISK_LABEL=$(grep -oE "risk:(low|medium|high|critical)" review_report.md | head -n 1 || echo "risk:medium")
          gh issue edit "$PR_NUMBER" --add-label "$RISK_LABEL" || true
