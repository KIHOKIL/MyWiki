<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Herdr Slides</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: #0a0f1a;
            color: #e2e8f0;
            font-family: 'Noto Sans KR', sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        .slide {
            background: rgba(139, 148, 158, 0.04);
            border: 1px solid rgba(139, 148, 158, 0.1);
            border-radius: 16px;
            padding: 4rem;
            width: 80%;
            max-width: 1000px;
            height: 60vh;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: center;
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h1 {
            font-size: 3rem;
            background: linear-gradient(135deg, #7c3aed, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }
        h2 { color: #38bdf8; font-size: 2rem; }
        p, li { font-size: 1.5rem; line-height: 1.6; }
        .nav {
            position: absolute;
            bottom: 2rem;
            display: flex;
            gap: 1rem;
        }
        a {
            color: #fff;
            text-decoration: none;
            background: #7c3aed;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: 0.3s;
        }
        a:hover { background: #38bdf8; }
        a.disabled { background: #555; pointer-events: none; }
    </style>
</head>
<body>
    <div class="slide">
        <h2>2. Herdr 핵심 강점 3가지</h2>
                      <ul>
                        <li><strong>상태 인식 (5 States)</strong>: Blocked, Working, Done 등 사이드바 표시</li>
                        <li><strong>에이전트 주도 조작</strong>: 에이전트가 명령어로 탭/Pane을 직접 분할</li>
                        <li><strong>세션 복원력</strong>: 터미널을 꺼도 <code>claude --resume</code>로 대화 복원</li>
                      </ul>
    </div>
    <div class="nav">
        <a href="01_background.html" class="">Prev</a>
        <a href="03_demo.html" class="">Next</a>
    </div>
    <script>
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' && '03_demo.html' !== '#') window.location.href = '03_demo.html';
            if (e.key === 'ArrowLeft' && '01_background.html' !== '#') window.location.href = '01_background.html';
        });
    </script>
</body>
</html>
