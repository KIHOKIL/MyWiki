name: CI - News Summarizer

on:
  push:
    paths:
      - '_sources/Projects/NewsSummarizer/**'
      - '.github/workflows/sys_news_summarizer_ci.yml'
      - '.github/workflows/tmpl_python_ci.yml'
  pull_request:
    paths:
      - '_sources/Projects/NewsSummarizer/**'
  workflow_dispatch: # 수동으로 원클릭 통합 검증 실행 지원

jobs:
  test-news-summarizer:
    uses: ./.github/workflows/tmpl_python_ci.yml
    with:
      working_directory: '_sources/Projects/NewsSummarizer'
      python_version: '3.10'
    secrets: inherit
