name: Reusable Python Agent Workflow

on:
  workflow_call:
    inputs:
      working_directory:
        description: '작업 디렉토리'
        required: true
        type: string
      script_command:
        description: '실행할 파이썬 명령어'
        required: true
        type: string
      commit_message:
        description: 'Git 자동 커밋 메시지'
        required: true
        type: string
      file_pattern:
        description: '커밋할 파일 패턴'
        required: true
        type: string

jobs:
  run-python-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        working-directory: ${{ inputs.working_directory }}
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi

      - name: Run script
        working-directory: ${{ inputs.working_directory }}
        # The calling workflow uses `secrets: inherit` so all secrets are available as env vars automatically?
        # Actually, `secrets: inherit` makes secrets available in the `secrets` context of the reusable workflow,
        # but NOT automatically as environment variables in the run steps.
        # However, passing all secrets to the run step env dynamically is not directly supported without listing them,
        # EXCEPT by dumping the whole secrets context or having the script read from python `os.environ`.
        # Wait, if the reusable workflow runs the script, the script won't have GEMINI_API_KEY in its env unless mapped.
        # Let's map the specific secrets used by the python agents.
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        run: ${{ inputs.script_command }}

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: ${{ inputs.commit_message }}
          file_pattern: ${{ inputs.file_pattern }}
