name: Reusable Python Agent Workflow

on:
  workflow_call:
    inputs:
      working_directory:
        description: '작업 디렉토리'
        required: true
        type: string
      script_command:
        description: '실행할 파이썬 명령어'
        required: true
        type: string
      commit_message:
        description: 'Git 자동 커밋 메시지'
        required: true
        type: string
      file_pattern:
        description: '커밋할 파일 패턴 (Artifact 업로드 시에도 사용됨)'
        required: true
        type: string
      download_path:
        description: 'Artifact를 다운로드할 경로 (기본값: .)'
        required: false
        type: string
        default: '.'

jobs:
  draft-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        working-directory: ${{ inputs.working_directory }}
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi

      - name: Run script
        working-directory: ${{ inputs.working_directory }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          SUBSCRIBERS_CSV_URL: ${{ secrets.SUBSCRIBERS_CSV_URL }}
        run: ${{ inputs.script_command }}

      - name: Upload generated files as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agent-draft-output
          path: ${{ inputs.file_pattern }}
          retention-days: 1
          if-no-files-found: ignore

  publish-content:
    needs: draft-content
    runs-on: ubuntu-latest
    environment: human-approval-required
    permissions:
      contents: write
      issues: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: agent-draft-output
          path: ${{ inputs.download_path }}

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: ${{ inputs.commit_message }}
          file_pattern: ${{ inputs.file_pattern }}
