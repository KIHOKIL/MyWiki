name: Daily News Summarizer

on:
  schedule:
    # 매일 아침 8시 (한국 시간 기준, UTC로는 전날 오후 11시)
    - cron: '0 23 * * *'
  workflow_dispatch: # 수동으로 실행할 수 있는 버튼 활성화

jobs:
  summarize-and-send:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 저장소에 파일을 커밋할 수 있는 권한 부여

    steps:
    - name: 저장소 코드 체크아웃
      uses: actions/checkout@v3

    - name: 파이썬 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 의존성 패키지 설치
      working-directory: _source/Projects/NewsSummarizer
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 스크립트 실행 (뉴스 요약 및 이메일 발송, 마크다운 저장)
      working-directory: _source/Projects/NewsSummarizer
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
      run: python main.py

    - name: 변경사항 커밋 및 푸시 (마크다운 파일 MyWiki에 저장)
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "📝 자동 요약 뉴스 브리핑 추가"
        file_pattern: "_source/News/Daily_Summaries/*.md"
