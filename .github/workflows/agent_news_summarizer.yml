name: Daily News Summarizer

on:
  schedule:
    # 매일 아침 8시 (한국 시간 기준, UTC로는 전날 오후 11시)
    - cron: '0 23 * * *'
  workflow_dispatch: # 수동으로 실행할 수 있는 버튼 활성화

jobs:
  run-summarizer:
    uses: ./.github/workflows/tmpl_python_agent.yml
    with:
      working_directory: '_sources/Projects/NewsSummarizer'
      script_command: 'python main.py'
      commit_message: "📝 자동 요약 뉴스 브리핑 추가"
      file_pattern: "_sources/News/Daily_Summaries/*.md"
    secrets: inherit
