name: Reusable Python CI Workflow

on:
  workflow_call:
    inputs:
      working_directory:
        description: '테스트할 프로젝트 디렉토리 (예: _sources/Projects/NewsSummarizer)'
        required: true
        type: string
      python_version:
        description: '파이썬 버전'
        required: false
        type: string
        default: '3.10'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
          cache: 'pip'

      - name: 의존성 설치
        run: |
          cd ${{ inputs.working_directory }}
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-mock

      - name: 전체 파이프라인 자동 통합 검증 (verify_all)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          SUBSCRIBERS_CSV_URL: ${{ secrets.SUBSCRIBERS_CSV_URL }}
        run: |
          cd ${{ inputs.working_directory }}
          if [ -f "verify_all.py" ]; then
            python verify_all.py --ci-mode
          else
            pytest tests/ -v
          fi

      - name: Create Issue on Failure
        if: failure()
        uses: JasonEtco/create-an-issue@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          filename: .github/ISSUE_TEMPLATE/ci_failure.md
          update_existing: true
