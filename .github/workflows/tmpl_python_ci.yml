name: Reusable Python CI Workflow

on:
  workflow_call:
    inputs:
      working_directory:
        description: '테스트할 프로젝트 디렉토리 (예: _source/Projects/NewsSummarizer)'
        required: true
        type: string
      python_version:
        description: '파이썬 버전'
        required: false
        type: string
        default: '3.10'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
          cache: 'pip'

      - name: 의존성 설치
        run: |
          cd ${{ inputs.working_directory }}
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-mock

      - name: 단위 및 통합 테스트 실행 (Logging)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd ${{ inputs.working_directory }}
          echo "## 🧪 테스트 실행 결과 (Logging)" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          # pytest 결과를 화면에도 출력하고, GITHUB_STEP_SUMMARY(마크다운 요약뷰)에도 덧붙입니다.
          pytest tests/ -v >> $GITHUB_STEP_SUMMARY 2>&1
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Create Issue on Failure
        if: failure()
        uses: JasonEtco/create-an-issue@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          filename: .github/ISSUE_TEMPLATE/ci_failure.md
          update_existing: true
