name: Run Pytest

on:
  push:
    branches:
      - main
    paths:
      - '_source/Projects/NewsSummarizer/**'
      - '.github/workflows/pytest.yml'
  pull_request:
    branches:
      - main
    paths:
      - '_source/Projects/NewsSummarizer/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 의존성 설치
        run: |
          cd _source/Projects/NewsSummarizer
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-mock

      - name: 단위 테스트(Unit Test) 실행
        run: |
          cd _source/Projects/NewsSummarizer
          pytest tests/test_summarizer_unit.py -v

      - name: 통합 테스트(Integration Test) 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd _source/Projects/NewsSummarizer
          pytest tests/test_summarizer_integration.py -v
